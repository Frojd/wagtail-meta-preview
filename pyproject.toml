[dependency-groups]
uv = ["uv==0.13.5"]
lint = ["ruff", "zizmor==1.32.0"]
build = ["setuptools", "wheel"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["migrations", "build", "*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicts with ruff format
    "COM812",
    # Docstrings are not required, the remaining D rules apply when one is written
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # D203 and D213 are incompatible with D211 and D212, which are kept
    "D203", "D213",
    # No copyright header in source files
    "CPY001",
    # Type annotations are not checked, the project has no type checker
    "ANN",
    # Django and Wagtail configure models and panels with mutable class attributes
    "RUF012",
    # Tests use Django TestCase, not pytest
    "PT009", "PT027",
]

[tool.ruff.lint.isort]
known-first-party = ["wagtail_meta_preview", "tests"]

[tool.ruff.lint.per-file-ignores]
"settings_dev.py" = ["F405"]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.coverage.run]
branch = true
source = ["wagtail_meta_preview"]
omit = ["wagtail_meta_preview/version.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
